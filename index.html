<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy: the preview renders user markdown via
      dangerouslySetInnerHTML, so a policy is the last line of defence.
      style-src needs 'unsafe-inline' (the app sets inline styles for
      font sizes) and connect-src allows Vite's dev websocket.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'"
    />
    <!-- NOTE: frame-ancestors is intentionally absent here — it is ignored
      in a <meta> CSP (Chrome warns about it). Real clickjacking
      protection needs the header set by the host (e.g. Cloudflare
      Worker): frame-ancestors 'none'. -->
    <title>OmniMark - Premium BiDi Markdown Editor</title>
    <meta name="description" content="A high-performance markdown editor with intelligent auto-direction (RTL/LTR), live synchronized preview, focus mode, and multi-document workspace." />
    <meta property="og:title" content="OmniMark - Premium BiDi Markdown Editor" />
    <meta property="og:description" content="A high-performance markdown editor with intelligent auto-direction (RTL/LTR), live synchronized preview, focus mode, and multi-document workspace." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Rubik:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

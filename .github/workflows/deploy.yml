# Deploy the static Vite build to GitHub Pages.
# Runs on every push to main (and on demand). The build uses a relative
# base ('./' in vite.config.ts), so it works under /markdowneasy/ as-is.
# First run: enable Pages in Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions" (the deploy job cannot create the site itself).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
